name: Build and Release

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve app version
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like "refs/tags/v*") {
            $tag = $env:GITHUB_REF_NAME
            if ($tag.StartsWith('v') -or $tag.StartsWith('V')) {
              $v = $tag.Substring(1)
            } else {
              $v = $tag
            }
          } else {
            $v = "0.0.0+" + $env:GITHUB_SHA.Substring(0, 7)
          }
          $safe = ($v -replace '[^0-9A-Za-z\.\-_]', '-')
          "app_version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "file_version=$safe" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "APP_VERSION=$v FILE_VERSION=$safe"

      - name: Configure CMake
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.app_version }}"
          Write-Host "Configuring with APP_VERSION=$v"
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release "-DAPP_VERSION=$v"
          $gen = "build\generated\AppVersion.h"
          if (-not (Test-Path $gen)) { throw "generated AppVersion.h missing" }
          $content = Get-Content $gen -Raw
          Write-Host $content
          if ($content -notmatch [regex]::Escape('"' + $v + '"')) {
            throw "AppVersion.h does not contain expected version `"$v`":`n$content"
          }

      - name: Build
        run: cmake --build build --config Release

      - name: Prepare artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $exe = @(
            "build\Release\WindowLayout.exe",
            "build\WindowLayout.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $exe) {
            Get-ChildItem -Recurse build -Filter *.exe | Format-Table FullName
            throw "WindowLayout.exe not found"
          }

          $v = "${{ steps.ver.outputs.app_version }}"
          $ver = "${{ steps.ver.outputs.file_version }}"

          # Hard fail if binary does not embed the version string
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $exe))
          $ascii = [System.Text.Encoding]::ASCII.GetString($bytes)
          $uni = [System.Text.Encoding]::Unicode.GetString($bytes)
          if (($ascii -notlike "*$v*") -and ($uni -notlike "*$v*")) {
            throw "Built exe does not contain version string '$v'. Include path is likely wrong."
          }
          Write-Host "Verified embedded version string: $v"

          $namedExe = "WindowLayout-v$ver.exe"
          $namedZip = "WindowLayout-v$ver-windows-x64.zip"

          # Zip keeps unversioned name for auto-update extraction
          Copy-Item $exe "dist\WindowLayout.exe"
          Copy-Item $exe "dist\$namedExe"
          Compress-Archive -Path "dist\WindowLayout.exe" -DestinationPath "dist\$namedZip" -Force
          Remove-Item "dist\WindowLayout.exe" -Force

          Write-Host "Release files: $namedExe , $namedZip"
          Get-ChildItem dist | Format-Table Name, Length

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: WindowLayout-windows-x64
          path: dist/*

      - name: Resolve release tag
        id: meta
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like "refs/tags/*") {
            $tag = $env:GITHUB_REF_NAME
            $name = "Release $tag"
            $prerelease = "false"
          } else {
            $sha = $env:GITHUB_SHA.Substring(0, 7)
            $tag = "latest"
            $name = "Continuous build ($sha)"
            $prerelease = "true"
          }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "name=$name" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "prerelease=$prerelease" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
